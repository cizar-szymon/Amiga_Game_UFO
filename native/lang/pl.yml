  STR_AMIGA: "AMIGA"
  STR_AMIGA_FOV: "ODKRYWANIE MAPY"
  STR_AMIGA_FOV_DESC: "Szybkie: po kroku liczy tylko promienie do pól jeszcze nieodkrytych, czasem zostaje zakryte pole. Dokładne (domyślne): po każdym kroku liczy wszystkie promienie, na 060 równie szybko. Test: jak Szybkie, z dodatkowym pierścieniem promieni 9-10 pól od żołnierza (do testów)."
  STR_AMIGA_FOV_FAST: "Szybkie"
  STR_AMIGA_FOV_ACCURATE: "Dokładne"
  STR_AMIGA_FOV_TEST: "Test"
  STR_AMIGA_SPLIT_WALK: "DZIELONE OBLICZENIA RUCHU"
  STR_AMIGA_SPLIT_WALK_DESC: "Rozkłada obliczanie widoczności i oświetlenia po każdym kroku na całą animację marszu, zamiast zatrzymywać żołnierza na każdym polu. Nie = jak w oryginale."
  STR_AMIGA_MUSIC: "MUZYKA"
  STR_AMIGA_MUSIC_DESC: "Amiga: melodie z amigowego UFO z Twoich dysków gry (pliki .mus i UFO.bank w data/UFO_AMIGA), cztery głosy, mało CPU; tam, gdzie wersja na Amigę nie ma melodii (bitwy, intro), gra muzyka z PC. Gra PC: melodie z wersji DOS, zapisane na dysk raz, przy pierwszym starcie (ok. 40 MB i kilka minut)."
  STR_AMIGA_MUSIC_OFF: "Wyłączona"
  STR_AMIGA_MUSIC_LIVE: "Amiga"
  STR_AMIGA_MUSIC_PRE: "Gra PC"
  STR_AMIGA_MUSIC_SRC: "ŹRÓDŁO MUZYKI"
  STR_AMIGA_MUSIC_SRC_DESC: "Tylko dla Muzyka = Gra PC: które pliki muzyki X-COM wykorzystać. Próbki gra SOUND/GM.CAT przez mikser portu; AdLib gra SOUND/ADLIB.CAT przez emulowaną kartę AdLib, czyli brzmienie FM pecetów z 1994 roku. Oba są raz zapisywane na dysk. Działa od następnego startu; żeby zapisać ponownie, usuń user/music."
  STR_AMIGA_MUSIC_SRC_SAMPLES: "Próbki (GM.CAT)"
  STR_AMIGA_MUSIC_SRC_ADLIB: "AdLib (ADLIB.CAT)"
  STR_AMIGA_SFX: "EFEKTY DŹWIĘKOWE"
  STR_AMIGA_SFX_DESC: "Gra PC: efekty z wersji DOS (SOUND/SAMPLE.CAT). Amiga: efekty z amigowego UFO z Twoich dysków gry (data/UFO_AMIGA/TacticalFX i GeoScapeFX); efekt, którego wersja na Amigę nie ma, zostaje z PC. Działa od następnego startu."
  STR_AMIGA_LANG_AUTO: "JĘZYK Z WORKBENCHA"
  STR_AMIGA_LANG_AUTO_DESC: "Przy starcie gra używa języka ustawionego w Workbenchu (Prefs/Locale), jeśli port ma takie tłumaczenie. Ręczny wybór języka w zakładce Obraz wyłącza tę opcję. Działa od następnego startu."
  STR_AMIGA_SPLASH: "EKRAN WCZYTYWANIA"
  STR_AMIGA_SPLASH_DESC: "Obrazki pokazywane, gdy gra się wczytuje. Nowoczesny: własne obrazki portu; Retro: te same sceny przerysowane w stylu 8-bit przez Bantera. Działa od następnego startu."
  STR_AMIGA_SPLASH_MODERN: "Nowoczesny"
  STR_AMIGA_SPLASH_RETRO: "Retro"
  STR_AMIGA_FPS: "POKAZUJ FPS"
  STR_AMIGA_FPS_DESC: "Pokazuje liczbę klatek na sekundę w lewym górnym rogu ekranu."
  STR_AMIGA_OFF: "Nie"
  STR_AMIGA_ON: "Tak"
